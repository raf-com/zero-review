name: zero-review-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        rust: [1.85.0, 1.96.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: pwsh
        run: |
          rustup toolchain install '${{ matrix.rust }}' --profile minimal --component rustfmt,clippy
          rustup override set '${{ matrix.rust }}'
          if ('${{ matrix.os }}' -eq 'windows-latest' -and '${{ matrix.rust }}' -eq '1.96.0') {
            .\scripts\ci.ps1
          } else {
            .\scripts\ci.ps1 -SkipApexContract
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zero-review-ci-receipts-${{ matrix.os }}-${{ matrix.rust }}-${{ github.sha }}
          path: artifacts/ci/
