name: zero-review-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        rust: [1.85.0, 1.96.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - shell: pwsh
        run: |
          rustup toolchain install '${{ matrix.rust }}' --profile minimal --component rustfmt,clippy
          rustup override set '${{ matrix.rust }}'
          .\scripts\ci.ps1 -SkipApexContract
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: zero-review-ci-receipts-${{ matrix.os }}-${{ matrix.rust }}-${{ github.sha }}
          path: artifacts/ci/
          retention-days: 90
