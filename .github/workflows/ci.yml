name: zero-review-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      - shell: powershell
        run: .\scripts\ci.ps1 -SkipApexContract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-review-ci-receipts
          path: artifacts/ci/
